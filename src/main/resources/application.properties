spring.application.name=nttdata
server.port=8080

# === Conexión MySQL - NTTDATA (BD nueva) ===
# Usa variables de entorno para no exponer credenciales en git.
# Configura DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD en tu entorno local.
# Ejemplo PowerShell: $env:DB_PASSWORD="tu_password"  |  bash: export DB_PASSWORD=tu_password
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:nttdata}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
